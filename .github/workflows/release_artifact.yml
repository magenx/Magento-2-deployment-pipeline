name: "Get release artifact for production"

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name'
        required: true
        type: string

env:
  TAG_NAME: ${{ github.event.release.tag_name || inputs.tag_name }}

jobs:
  attach-artifact:
    if: "${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Find latest release artifact
        id: find-artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # exact name match: release_<date>_<tag>.tar.gz, dots as [.] (no escaping through jq)
          ARTIFACT_PATTERN="^release_[0-9]+_${TAG_NAME//./[.]}[.]tar[.]gz$"
          # all pages, not only the 30 newest artifacts; skip expired ones
          ARTIFACT_JSON=$(gh api --paginate \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
          --jq '.artifacts[] | select((.expired | not) and (.name | test("'"$ARTIFACT_PATTERN"'"))) | {id, name, archive_download_url, created_at, digest, workflow_run}' \
          | jq -s 'sort_by(.created_at) | last')
          
          if [ "$(echo "$ARTIFACT_JSON" | jq -r '.id')" == "null" ]; then
            echo "❌ No artifact found matching pattern: $ARTIFACT_PATTERN"
            exit 1
          fi
          
          echo "artifact_id=$(echo $ARTIFACT_JSON | jq -r '.id')" >> $GITHUB_OUTPUT
          echo "artifact_digest=$(echo $ARTIFACT_JSON | jq -r '.digest')" >> $GITHUB_OUTPUT
          echo "artifact_run_id=$(echo $ARTIFACT_JSON | jq -r '.workflow_run.id')" >> $GITHUB_OUTPUT
          echo "artifact_name=$(echo $ARTIFACT_JSON | jq -r '.name')" >> $GITHUB_OUTPUT
          echo "artifact_url=$(echo $ARTIFACT_JSON | jq -r '.archive_download_url')" >> $GITHUB_OUTPUT
          
          echo "✅ Found artifact: $(echo $ARTIFACT_JSON | jq -r '.name')"
          echo "Artifact url: $(echo $ARTIFACT_JSON | jq -r '.archive_download_url')"

      - name: Attach build artifact link to this release information
        id: artifact-link-to-release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b #v3.0.1
        with:
          tag_name: "${{ env.TAG_NAME }}"
          append_body: true
          body: |
            -- 
            ✅ Link to release build artifact:
            ${{ steps.find-artifact.outputs.artifact_name }}
            ${{ steps.find-artifact.outputs.artifact_url }}

      - name: Trigger post-release deployment workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
          --method POST \
          --header "Accept: application/vnd.github+json" \
          --header "X-GitHub-Api-Version: 2026-03-10" \
          /repos/${{ github.repository }}/dispatches \
          -f 'event_type=deployment' \
          -f 'client_payload[environment]=production' \
          -f 'client_payload[artifact_name]=${{ steps.find-artifact.outputs.artifact_name }}' \
          -f 'client_payload[artifact_url]=${{ steps.find-artifact.outputs.artifact_url }}' \
          -f 'client_payload[artifact_digest]=${{ steps.find-artifact.outputs.artifact_digest }}' \
          -F 'client_payload[artifact_run_id]=${{ steps.find-artifact.outputs.artifact_run_id }}' \
          -f "client_payload[tag_name]=${TAG_NAME}"
