name: Deploy to environment

on:
  repository_dispatch:
    types: [deployment]

env:
  PRERELEASE_TYPE: ${{ vars.PRERELEASE_TYPE || 'alpha' }}
  DEPLOY_ENV: ${{ github.event.client_payload.environment }}
  TAG_NAME: ${{ github.event.client_payload.tag_name }}
  ARTIFACT_NAME: ${{ github.event.client_payload.artifact_name }}

concurrency:
  group: deploy-${{ github.event.client_payload.environment }}

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.client_payload.environment }}
    steps:
      - name: Download latest artifact
        id: artifact-download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8.0.2
        with:
          name: ${{ github.event.client_payload.artifact_name }}
          path: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.client_payload.artifact_run_id }}

      # keys only in this step's env, never in $GITHUB_ENV
      - name: Upload latest artifact to S3 storage
        id: artifact-upload-to-s3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          endpoint=()
          [ -n "${S3_ENDPOINT}" ] && endpoint=(--endpoint-url "${S3_ENDPOINT}")
          aws "${endpoint[@]}" s3 cp "./${GITHUB_RUN_ID}/${ARTIFACT_NAME}" "s3://${S3_BUCKET}/releases/${ARTIFACT_NAME}"

        # magenx-deputy-go receiver: numeric timestamp, sha256 of the tar.gz itself
        # (GitHub's artifact digest is of the zip wrapper, not the file deputy downloads).
        # Deputy answers after deploy + health check, so wait and never retry (a retry deploys twice).
      - name: Trigger webhook to start deployment
        id: deployment-webhook
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          SIGNATURE_HMAC_KEY: ${{ secrets.SIGNATURE_HMAC_KEY }}
          WEBHOOK_TIMEOUT: ${{ vars.DEPLOY_WEBHOOK_TIMEOUT || '960' }}
        run: |
          timestamp=$(date -u +%s)
          digest="sha256:$(sha256sum "./${GITHUB_RUN_ID}/${ARTIFACT_NAME}" | cut -d' ' -f1)"
          jq -cn \
            --arg artifact_name "${ARTIFACT_NAME}" \
            --arg artifact_digest "${digest}" \
            --argjson timestamp "${timestamp}" \
            '{artifact_name: $artifact_name, artifact_digest: $artifact_digest, timestamp: $timestamp}' \
            | tr -d '\n' > payload.json

          webhook_payload_signature=$(openssl dgst -sha256 -hmac "${SIGNATURE_HMAC_KEY}" -r < payload.json | cut -d' ' -f1)

          curl -sS --fail-with-body --max-time "${WEBHOOK_TIMEOUT}" \
            -X POST "${DEPLOY_WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: ${DEPLOY_WEBHOOK_SECRET}" \
            -H "X-Signature: sha256=${webhook_payload_signature}" \
            -H "X-Timestamp: ${timestamp}" \
            --data-binary @payload.json

      - name: Create comment about deployment status
        id: deployment-status-comment
        if: ${{ !cancelled() }}
        run: |
          COMMENT=""
          declare -A step_icons=( ["success"]="✔️" ["failure"]="❌" ["skipped"]="➖"  ["cancelled"]="✖️" )
          COMMENT+="## ⚠️ ${DEPLOY_ENV} release ${TAG_NAME} deployment status:\n"
          COMMENT+="${step_icons[${{ steps.artifact-download.outcome }}]} Download release artifact: ${{ steps.artifact-download.outcome }}\n"
          COMMENT+="${step_icons[${{ steps.artifact-upload-to-s3.outcome }}]} Upload artifact to S3 storage: ${{ steps.artifact-upload-to-s3.outcome }}\n"
          COMMENT+="${step_icons[${{ steps.deployment-webhook.outcome }}]} Deployment event webhook trigger: ${{ steps.deployment-webhook.outcome }}\n"
          echo -e "${COMMENT}" > deployment.txt
          echo "deployment_status<<EOF" >> $GITHUB_OUTPUT
          echo -e "$COMMENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Find ${{ github.event.client_payload.environment }} release PR
        id: find-pr
        if: ${{ github.event.client_payload.environment == 'staging' && !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # production release PR: pending release-please PR whose title has no pre-release suffix
          pr_number=$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --state open \
            --label "autorelease: pending" \
            --json number,title \
            --jq "[.[] | select(.title | contains(\"-${PRERELEASE_TYPE}\") | not)] | first | .number // empty")
          echo "pr_number=$pr_number" >> ${GITHUB_OUTPUT}

      - name: Add comment about deployment status
        id: deployment-status
        if: ${{ github.event.client_payload.environment == 'staging' && !cancelled() && steps.find-pr.outputs.pr_number != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ steps.find-pr.outputs.pr_number }} \
          --repo "${GITHUB_REPOSITORY}" \
          --body-file deployment.txt

      - name: Set current date
        id: date
        if: ${{ github.event.client_payload.environment == 'production' && !cancelled() }}
        run: echo "date=$(date +%Y-%m-%d-%H:%M)" >> $GITHUB_OUTPUT

      - name: Find and manage production deployment issue
        id: deployment-issue
        if: ${{ github.event.client_payload.environment == 'production' && !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_ISSUES=$(gh issue list --label "release" --state open \
          --repo "${GITHUB_REPOSITORY}" \
          --search "Production release deployment status" \
          --json number,title --jq '.[] | select(.title | startswith("Production release deployment status")) | .number') 
          if [ -n "$EXISTING_ISSUES" ]; then
            echo "$EXISTING_ISSUES" | while read -r issue; do
              gh issue close "$issue" --comment "new deployment [${ARTIFACT_NAME}]" \
                --reason "not planned" \
                --repo "${GITHUB_REPOSITORY}"
            done
          fi
          gh label create "deployment: ${{ job.status }}" --repo "${GITHUB_REPOSITORY}" --force > /dev/null
          gh label create "release" --repo "${GITHUB_REPOSITORY}" --force > /dev/null
          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Production release deployment status [${{ job.status }}]" \
            --body "  
            ${{ steps.deployment-status-comment.outputs.deployment_status }}
          
              generated on: [${{ steps.date.outputs.date }}]
              [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" \
            --label "deployment: ${{ job.status }}" \
            --label "release" \
            --assignee "${{ github.repository_owner }}"
